<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Survey Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #222;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 480px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #0056b3;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Survey is offline</h1>
    <p>Please reconnect to the internet or local network, then reopen the survey.</p>
    <a href="/survey">Retry</a>
  </div>
</body>
</html>
